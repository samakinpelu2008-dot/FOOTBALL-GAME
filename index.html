<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresher's Cup - Broadcast Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --red: #C62828; --blue: #1565C0; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: 'Inter', sans-serif; overflow: hidden; }

        /* Background Video */
        #video-viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        #player { width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .tint { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 2; }

        /* Scoreboard Overlay */
        #overlay-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: none; }
        .score-bug { position: absolute; top: 30px; left: 30px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); }
        .bar { display: flex; background: #111; height: 40px; border-left: 4px solid var(--gold); align-items: center; color: white; font-weight: 900; }
        .score { width: 40px; height: 100%; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .team { padding: 0 15px; font-size: 14px; }
        .time { padding: 0 15px; font-size: 16px; font-variant-numeric: tabular-nums; }

        /* Controls */
        .controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
        .btn { padding: 12px 24px; border-radius: 5px; border: none; font-weight: 900; cursor: pointer; background: #fff; }

        /* Start Screen */
        #launcher { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div id="launcher">
        <button class="btn" onclick="initBroadcast()">CONNECT TO LIVE FEED</button>
    </div>

    <div id="video-viewport">
        <div id="player"></div>
        <div class="tint"></div>
    </div>

    <div id="overlay-ui">
        <div class="score-bug">
            <div style="background:var(--gold); color:#000; font-size:10px; font-weight:900; padding:2px 10px; width:fit-content;">LIVE</div>
            <div class="bar">
                <div class="team" style="background:var(--red)">RED</div>
                <div class="score" id="score-r">0</div>
                <div class="score" id="score-b">0</div>
                <div class="team" style="background:var(--blue)">BLU</div>
                <div class="time" id="match-clock">00:00</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" onclick="updateScore('r')">RED GOAL</button>
            <button class="btn" onclick="updateScore('b')">BLUE GOAL</button>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'O4v-o1xeco0',
                playerVars: { 'autoplay': 0, 'controls': 0, 'mute': 1, 'loop': 1, 'playlist': 'O4v-o1xeco0' }
            });
        }

        function initBroadcast() {
            if(player && player.playVideo) {
                player.playVideo();
                document.getElementById('launcher').style.display = 'none';
                document.getElementById('overlay-ui').style.display = 'block';
                startClock();
            }
        }

        function startClock() {
            let s = 0;
            setInterval(() => {
                s++;
                let m = Math.floor(s/60);
                let sec = s%60;
                document.getElementById('match-clock').innerText = 
                    `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
            }, 1000);
        }

        function updateScore(t) {
            let el = document.getElementById(`score-${t}`);
            el.innerText = parseInt(el.innerText) + 1;
        }
    </script>
</body>
</html>
