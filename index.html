<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ethical Hacking Practice Lab</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #eee; display: flex; flex-direction: column; align-items: center; padding: 50px; }
        .container { background: #2d2d2d; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 400px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #444; background: #3d3d3d; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .secret-area { margin-top: 20px; padding: 15px; border: 1px dashed #555; display: none; background: #222; }
        .hint { color: #888; font-size: 0.8em; margin-top: 20px; cursor: help; }
        #output { margin-top: 15px; color: #ffca28; }
    </style>
</head>
<body>

    <h2>Target: SecurePortal v1.0</h2>
    
    <div class="container">
        <div id="login-section">
            <h3>Staff Login</h3>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="checkLogin()">Login</button>
        </div>

        <div id="user-section" style="display:none;">
            <h3>Welcome, Admin</h3>
            <p>Update your status:</p>
            <input type="text" id="statusInput" placeholder="How are you feeling?">
            <button onclick="updateStatus()">Post Status</button>
            <div id="output"></div>
        </div>
    </div>

    <div class="hint" onclick="alert('Try Inspecting the source code (Ctrl+U) or checking the checkLogin function in the console!')">
        Need a hint? Click here.
    </div>

    <script>
        // MISSION 1: A "Hardcoded Credentials" vulnerability
        // In a real site, this would be on a server. Here, it's visible in the source!
        function checkLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === "admin" && pass === "p@ssword123") {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('user-section').style.display = 'block';
            } else {
                alert("Invalid credentials!");
            }
        }

        // MISSION 2: Reflected XSS vulnerability
        // This function takes user input and puts it directly into the HTML 
        // without "sanitizing" it.
        function updateStatus() {
            const input = document.getElementById('statusInput').value;
            const display = document.getElementById('output');
            
            // VULNERABILITY: Using innerHTML allows the browser to execute <script> tags!
            display.innerHTML = "Current Status: " + input;
        }
    </script>
</body>
  </html>
