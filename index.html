<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fresher's Cup - Full Frame Broadcast</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700;
            --red: #E53935;
            --blue: #1E88E5;
            --glass: rgba(0, 0, 0, 0.8);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000; /* Dark background for letterboxing */
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
        }

        /* --- THE VIDEO CONTAINER (OBJECT-FIT: CONTAIN) --- */
        #broadcast-wrapper {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* Strict 16:9 Aspect Ratio */
            max-height: 100vh;
            max-width: 177.77vh;
            background: #000;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        #player {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* --- SCOREBOARD (Inside the video frame) --- */
        #scoreboard {
            position: absolute;
            top: 5%; left: 5%;
            z-index: 100;
            display: none;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
        }

        .bug-top {
            background: var(--gold);
            color: #000;
            font-size: clamp(8px, 1.5vw, 12px);
            font-weight: 900;
            padding: 2px 8px;
            display: flex;
            justify-content: space-between;
        }

        .bug-main {
            display: flex;
            background: var(--glass);
            backdrop-filter: blur(5px);
            height: clamp(30px, 6vw, 45px);
            align-items: center;
        }

        .team {
            padding: 0 12px;
            font-family: 'Oswald', sans-serif;
            font-size: clamp(12px, 2.5vw, 18px);
            text-transform: uppercase;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .score {
            width: clamp(30px, 6vw, 45px);
            height: 100%;
            background: #fff;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: clamp(14px, 3vw, 22px);
        }

        .clock {
            padding: 0 12px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            font-size: clamp(10px, 2vw, 16px);
        }

        /* --- NOTIFICATION POPUP --- */
        #pop-event {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--gold);
            color: #000;
            padding: 5px 20px;
            font-weight: 900;
            text-transform: uppercase;
            border-radius: 4px;
            opacity: 0;
            transition: 0.3s ease;
            font-size: clamp(10px, 2vw, 14px);
        }

        #pop-event.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* --- ADMIN PANEL --- */
        .controls {
            position: fixed;
            bottom: 20px;
            z-index: 1000;
            display: none;
            gap: 10px;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .btn {
            background: #fff; border: none; padding: 8px 12px;
            border-radius: 4px; font-weight: 900; cursor: pointer; font-size: 10px;
        }

        #launcher {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000; display: flex;
            justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

    <div id="launcher">
        <button class="btn" style="padding: 15px 30px; font-size: 14px;" onclick="start()">START BROADCAST</button>
    </div>

    <div id="broadcast-wrapper">
        <div id="player"></div>

        <div id="scoreboard">
            <div class="bug-top">
                <span>FRESHER'S CUP</span>
                <span style="opacity: 0.8;">1ST HALF</span>
            </div>
            <div class="bug-main">
                <div class="team" style="background: var(--red);">RED</div>
                <div class="score" id="score-red">0</div>
                <div class="score" id="score-blue">0</div>
                <div class="team" style="background: var(--blue);">BLU</div>
                <div class="clock" id="match-timer">00:00</div>
            </div>
        </div>

        <div id="pop-event">GOAL!</div>
    </div>

    <div class="controls" id="admin-ui">
        <button class="btn" onclick="matchEvent('red', 'goal')">RED +1</button>
        <button class="btn" onclick="matchEvent('blue', 'goal')">BLU +1</button>
        <button class="btn" onclick="matchEvent('red', 'card')" style="background: #ffd600;">RED CARD</button>
        <button class="btn" onclick="location.reload()" style="background: #ff4444; color:#fff;">RESET</button>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let yt;
        function onYouTubeIframeAPIReady() {
            yt = new YT.Player('player', {
                videoId: 'O4v-o1xeco0',
                playerVars: { 'autoplay': 0, 'controls': 0, 'mute': 1, 'loop': 1, 'playlist': 'O4v-o1xeco0', 'playsinline': 1 }
            });
        }

        function start() {
            if(yt && yt.playVideo) {
                yt.playVideo();
                document.getElementById('launcher').style.display = 'none';
                document.getElementById('scoreboard').style.display = 'block';
                document.getElementById('admin-ui').style.display = 'flex';
                runTimer();
            }
        }

        function runTimer() {
            let s = 0;
            setInterval(() => {
                s++;
                let m = Math.floor(s/60);
                let sec = s%60;
                document.getElementById('match-timer').innerText = 
                    `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
            }, 1000);
        }

        function matchEvent(team, type) {
            const pop = document.getElementById('pop-event');
            if(type === 'goal') {
                const s = document.getElementById(`score-${team}`);
                s.innerText = parseInt(s.innerText) + 1;
                pop.innerText = `GOAL - ${team.toUpperCase()}!`;
            } else {
                pop.innerText = `CARD - ${team.toUpperCase()}`;
            }
            pop.classList.add('show');
            setTimeout(() => pop.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
